[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rolemodel-helper-v2"
version = "0.1.0"
description = "Fast hybrid role and access lookup assistant"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.31,<3",
  "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
